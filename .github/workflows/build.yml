name: Build plugin

on:
  push:
    branches: [main]
    tags: ['v*', '[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches Gradle downloads and checks the wrapper jar is genuine.
      - uses: gradle/actions/setup-gradle@v4

      # On a tag (v1.2.0 or 1.2.0) the jar takes the tag's version; otherwise build.gradle's default.
      - name: Build jar
        run: |
          chmod +x gradlew
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            ./gradlew jar --no-daemon -PpluginVersion="${GITHUB_REF_NAME#v}"
          else
            ./gradlew jar --no-daemon
          fi

      - name: Check the jar
        id: jar
        run: |
          jar=$(ls build/libs/*.jar)
          echo "Built $jar"
          # Manifest lines wrap at 72 characters; join them back up before checking.
          unzip -p "$jar" META-INF/MANIFEST.MF | tr -d '\r' | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n //g' | tee manifest.txt
          grep -q '^Plugin-Class: com.custom.morpheus.networkvms.NetworkVmsTabPlugin' manifest.txt
          unzip -l "$jar" | grep -q 'renderer/hbs/networkVms.hbs'
          version=$(grep '^Plugin-Version:' manifest.txt | cut -d' ' -f2 | tr -d '\r')
          echo "path=$jar" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: network-vms-tab-${{ steps.jar.outputs.version }}
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check the jar matches the tag
        run: |
          jar=$(ls dist/*.jar)
          expected="dist/network-vms-tab-${GITHUB_REF_NAME#v}.jar"
          if [ "$jar" != "$expected" ]; then
            echo "::error::Expected $expected but built $jar"
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true